<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Работы Yardy Project — сайты для разных сфер</title>
<meta name="description" content="Работы студии Yardy Project по сферам: строительство, барбершопы, маникюр. Сайты с 3D-графикой и онлайн-записью.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: тёмный «чертёжный» лист, 3D-каркас здания в первом экране, дальше узкие полосы-разделы на сетке 1200px */
:root {
  --bg: #0a1626;
  --panel: #0f2035;
  --line: #213958;
  --ink: #e9eef5;
  --muted: #8fa3bd;
  --accent: #f2a33a;
  --accent-ink: #1b1003;
  --f-display: "Tektur", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; opacity: .22; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.in { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: clamp(26px, 3.4vw, 42px); }
h3 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.3; }
p { margin: 0; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 24px; border-radius: 3px; border: 1.5px solid var(--ink); font: 600 16px/1 var(--f-body); text-decoration: none; color: var(--ink); background: transparent; transition: transform .2s, background .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.top .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo svg { width: 34px; height: 34px; flex: none; }
.nav { display: flex; gap: 26px; font-size: 15px; }
.nav a { text-decoration: none; color: var(--muted); }
.nav a:hover { color: var(--ink); }

.hero .in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 24px 64px; }
.hero-text { display: grid; gap: 24px; min-width: 0; }
.hero h1 { font-size: clamp(36px, 5.4vw, 72px); }
.hero h1 span { color: var(--accent); }
.hero .lead { font-size: 19px; color: var(--muted); max-width: 30em; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-family: var(--f-mono); font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.chip b { color: var(--accent); font-weight: 500; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.scene { position: relative; height: clamp(320px, 42vw, 560px); min-width: 0; }
.scene canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab;
  /* края сцены растворяются в фоне, без жёсткой рамки у сетки */
  -webkit-mask-image: radial-gradient(ellipse 60% 62% at 50% 52%, #000 62%, transparent 100%);
  mask-image: radial-gradient(ellipse 60% 62% at 50% 52%, #000 62%, transparent 100%); }
.scene .dim { position: absolute; right: 8px; bottom: 8px; pointer-events: none; }

section.block .in { padding-block: 80px; display: grid; gap: 36px; }
.head { display: grid; gap: 12px; max-width: 44em; }
.head p { color: var(--muted); font-size: 18px; }

.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.why article { background: var(--bg); padding: 28px; display: grid; gap: 12px; align-content: start; }
.why b { font-family: var(--f-display); font-size: 40px; color: var(--accent); line-height: 1; font-weight: 500; }
.why p { color: var(--muted); }

.work { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.shot { display: block; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; position: relative; text-decoration: none; }
.shot img { width: 100%; height: auto; transition: transform .5s; }
.shot:hover img { transform: scale(1.02); }
.shot .tag { position: absolute; left: 12px; top: 12px; background: var(--bg); padding: 6px 10px; border-radius: 3px; color: var(--ink); }
.work-text { display: grid; gap: 16px; }
.works { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px 28px; margin-bottom: 28px; }
.work-card { display: grid; gap: 14px; align-content: start; justify-items: start; }
.work-card .shot { width: 100%; }
.work-card ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 6px; }
.work-text ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 6px; }
.next { border: 1px dashed var(--line); padding: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; gap: 10px; align-content: start; padding-top: 18px; border-top: 2px solid var(--line); }
.steps li::before { content: "0" counter(s); font-family: var(--f-mono); color: var(--accent); font-size: 14px; }
.steps li:first-child { border-top-color: var(--accent); }
.steps p { color: var(--muted); font-size: 15px; }
.steps .t { font-family: var(--f-mono); font-size: 13px; color: var(--ink); }

.prices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.price { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 30px; display: grid; gap: 16px; align-content: start; }
.price.main { border-color: var(--accent); }
.price .sum { font-family: var(--f-display); font-size: clamp(34px, 4vw, 48px); line-height: 1; font-variant-numeric: tabular-nums; }
.price .sum small { font-family: var(--f-body); font-size: 16px; color: var(--muted); font-weight: 400; }
.price ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--muted); }

.contact { background: var(--accent); color: var(--accent-ink); }
.contact .in { padding-block: 72px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.contact h2 { font-size: clamp(28px, 3.6vw, 46px); }
.contact p { font-size: 18px; margin-top: 14px; }
.contact .links { display: grid; gap: 12px; justify-items: start; }
.contact .btn { border-color: var(--accent-ink); color: var(--accent-ink); }
.contact .btn.dark { background: var(--accent-ink); color: var(--accent); }
.contact .mono { font-family: var(--f-mono); font-size: 22px; user-select: all; }

footer .in { padding-block: 28px 36px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }

@media (max-width: 900px) {
  .hero .in, .work, .contact .in { grid-template-columns: minmax(0, 1fr); }
  .scene { order: -1; }
  .why, .prices { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .nav { display: none; }
}
@media (max-width: 520px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  section.block .in { padding-block: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .btn, .shot img { transition: none; }
}
</style>
<style>
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 14px; }
@media (min-width: 700px) { .folders { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; } }
.folder { position: relative; display: grid; gap: 6px; text-align: left; padding: clamp(18px, 3vw, 30px) clamp(14px, 2vw, 20px) clamp(14px, 2vw, 20px); margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 0 6px 6px 6px; color: var(--ink); font: inherit; cursor: pointer; transition: border-color .2s, transform .2s; }
.folder::before { content: ""; position: absolute; left: -1px; top: -14px; width: 42%; height: 14px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 10px 0 0; }
.folder:hover { transform: translateY(-2px); }
.folder[aria-expanded="true"], .folder[aria-expanded="true"]::before { border-color: var(--accent); }
.folder b { font: 700 clamp(18px, 2.4vw, 22px)/1.1 var(--f-display); overflow-wrap: anywhere; }
.folder .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.folder[aria-expanded="true"] .n { color: var(--accent); }
.folder:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.open { display: grid; gap: 24px; }
.open h2 { font-size: clamp(24px, 4vw, 34px); }
.empty { border: 1px dashed var(--line); padding: 28px; color: var(--muted); }
.works { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 32px 28px; }
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <a class="logo" href="../" aria-label="Yardy Project — на главную"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="13" fill="#f2a33a"/> <path transform="translate(14.63 51.00) scale(0.0543 -0.0543)" fill="#0a1626" d="M236 0V210H151L13 700H192L277 355H363L448 700H627L489 210H404V0Z"/></svg>YARDY PROJECT</a>
    <nav class="nav" aria-label="Разделы">
      <a href="#folders">Работы</a>
      <a href="../#how">Как работаем</a>
      <a href="../#prices">Цены</a>
      <a href="../#contact">Связаться</a>
    </nav>
  </div>
</header>

<section class="block" id="folders">
  <div class="in">
    <div class="head">
      <span class="label">Работы по сферам</span>
      <h1 style="font-size:clamp(34px,6vw,56px)">Наши работы</h1>
      <p>Выберите папку. Делаем сайты для любого бизнеса, не только для этих сфер.</p>
    </div>
    <div class="folders" role="group" aria-label="Папки с работами" id="folder-list"></div>
    <div class="open" id="open" aria-live="polite"></div>
    <div class="next">
      <span>Не нашли свою сферу? Сделаем демо вашего сайта бесплатно.</span>
      <a class="btn primary" href="../#contact">Получить демо</a>
    </div>
  </div>
</section>

<footer>
  <div class="in">
    <span>© 2026 Yardy Project</span>
    <span>Россия</span>
  </div>
</footer>

<script>
// Папки с работами. Новую работу добавляем в items нужной папки, новую сферу — новой папкой.
const FOLDERS = [
  { id: "stroy", name: "Строительство", items: [
    { title: "Контур-54 · стройкомпания", url: "../kontur54/", img: "../assets/kontur54.jpg", tag: "3D-сайт",
      alt: "Первый экран демо-сайта Контур-54 с 3D-моделью дома",
      points: ["3D-дом собирается по этапам стройки, конструктор дома", "Калькулятор стоимости и форма заявки"] }
  ] },
  { id: "barber", name: "Барбершопы", items: [
    { title: "Чуб · барбершоп", url: "../chub/", img: "../assets/chub.jpg", tag: "Онлайн-запись",
      alt: "Экраны сайта барбершопа Чуб: услуги, выбор барбера и времени, журнал записей",
      points: ["Онлайн-запись: услуга, барбер, свободное время", "Журнал записей и выручка для владельца"] }
  ] },
  { id: "nails", name: "Маникюр", items: [] }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const word = n => n % 10 === 1 && n % 100 !== 11 ? "работа" : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? "работы" : "работ";
const list = document.getElementById("folder-list"), open = document.getElementById("open");
function show(id, scroll) {
  const f = FOLDERS.find(x => x.id === id) || FOLDERS[0];
  list.querySelectorAll(".folder").forEach(b => b.setAttribute("aria-expanded", b.dataset.id === f.id));
  open.innerHTML = `<h2>${esc(f.name)}</h2>` + (f.items.length ? `<div class="works">${f.items.map(w => `
    <article class="work-card">
      <a class="shot" href="${w.url}"><img src="${w.img}" alt="${esc(w.alt)}" width="1440" height="900" loading="lazy"><span class="tag label">${esc(w.tag)}</span></a>
      <h3>${esc(w.title)}</h3>
      <ul>${w.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <a class="btn primary" href="${w.url}">Открыть сайт</a>
    </article>`).join("")}</div>` : `<div class="empty">Работа в этой папке скоро появится.</div>`);
  try { history.replaceState(null, "", "#" + f.id); } catch (e) {}
  if (scroll) open.scrollIntoView({ behavior: "smooth", block: "start" });
}
list.innerHTML = FOLDERS.map(f => `<button class="folder" type="button" data-id="${f.id}" aria-expanded="false" aria-controls="open"><b>${esc(f.name)}</b><span class="n">${f.items.length ? f.items.length + " " + word(f.items.length) : "скоро"}</span></button>`).join("");
list.addEventListener("click", e => { const b = e.target.closest(".folder"); if (b) show(b.dataset.id, true); });
show(location.hash.slice(1), false);
</script>
</body>
</html>
